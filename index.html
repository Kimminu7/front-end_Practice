  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

    * {
      font-family: "Gowun Dodum";
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: #96f104;
      padding: 10px 0;
    }

    body {
      padding-top: 80px;
      /* 헤더 높이만큼 여백 추가 */
    }


    header>a>h2 {
      padding-top: 10px;
    }

    header>a>img {
      margin-left: 10px;
    }

    header>ul {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header>ul>li {
      margin: 10px;
      border: 1px solid white;
      border-radius: 7px;
    }

    nav {
      height: 700px;
      background: #000;
      background-image: url('./images/백그라운드.webp');
      background-repeat: no-repeat;
      background-size: cover;
      /* 이미지를 부모 영역에 맞게 조정하지만 잘리지 않게 함 */
      background-position: center;
      /* 이미지를 중앙에 위치 */
    }

    .swiper-container {
      width: 100%;
      height: 400px;
      position: relative;
      overflow: hidden;
      /* 부모 요소가 초과하는 부분 잘라내기 */
      box-sizing: border-box;
      /* 크기 계산 방식 수정 */
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f1f1;
      font-size: 24px;
      color: #333;
      height: 100%;
      width: 100%;
      /* 슬라이드 크기를 부모 크기에 맞추기 */
    }

    .swiper-button-next,
    .swiper-button-prev {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ff6600;
      z-index: 10;
      font-size: 30px;
    }

    .swiper-button-prev {
      left: 10px;
    }

    .swiper-button-next {
      right: 10px;
    }

    .swiper-pagination {
      position: absolute;
      bottom: 10px;
      left: 50%;
      z-index: 10;
    }

    .swiper-pagination-bullet {
      background-color: #ff6600;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: white;
    }
  </style>
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script type="module">
    // Firebase SDK 라이브러리 가져오기

    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // Firebase 구성 정보 설정
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyASGSDYEPKuBLJKweMWowhTN7cZJ9ZZ2iE",
      authDomain: "sparta-f56d4.firebaseapp.com",
      projectId: "sparta-f56d4",
      storageBucket: "sparta-f56d4.firebasestorage.app",
      messagingSenderId: "260121902304",
      appId: "1:260121902304:web:e1773f6e870790cfa2e485",
      measurementId: "G-YMEHL2WJRD"
    };

    // Firebase 인스턴스 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("resetbtn").addEventListener("click", function () {
      document.getElementById("image").value = "";
      document.getElementById("title").value = "";
      document.getElementById("star").selectedIndex = 0;
      document.getElementById("comment").value = "";
    });
  </script>
  <script>
    // Swiper 초기화
    document.addEventListener("DOMContentLoaded", function () {
      var swiper = new Swiper(".swiper-container", {
        loop: true,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    });

  </script>
</head>

<body>
